<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checkout — Velora</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="checkout.css"></head>
<body data-page="checkout"><header class="site-header"><a class="wordmark" href="index.html">velora<span>.</span></a><nav class="main-nav"><a href="index.html" data-i18n="Home">Home</a><a href="catalog.html" data-i18n="Shop">Shop</a></nav><div class="header-actions"><div class="language-switcher"><button data-language="kz">KZ</button><button data-language="ru">RU</button><button data-language="en">EN</button></div><a class="icon-button" href="index.html" data-i18n="Continue shopping">Continue shopping</a></div></header>
<main class="checkout-wrap"><a class="text-link" href="catalog.html">← <span data-i18n="Continue shopping">Continue shopping</span></a><h1 data-i18n="Checkout">Checkout</h1><div class="checkout-grid"><form id="checkout-form" class="checkout-form"><h2 data-i18n="Delivery details">Delivery details</h2><label><span data-i18n="Full name">Full name</span><input name="customer_name" required maxlength="120" autocomplete="name"></label><label><span data-i18n="Phone number">Phone number</span><input name="phone" type="tel" required maxlength="30" autocomplete="tel" placeholder="+7 700 000 00 00"></label><label><span data-i18n="City">City</span><input name="city" required maxlength="100" autocomplete="address-level2"></label><label><span data-i18n="Address">Address</span><textarea name="address" required maxlength="500" autocomplete="street-address" rows="3"></textarea></label><label><span data-i18n="Comment">Comment</span><textarea name="comment" maxlength="1000" rows="3"></textarea></label><p id="checkout-message" role="status"></p><button class="button button-dark" type="submit" data-i18n="Place order">Place order</button></form><aside class="checkout-summary"><h2 data-i18n="Your order">Your order</h2><div id="checkout-items"></div><p class="checkout-total"><span data-i18n="Total">Total</span><strong id="checkout-total"></strong></p></aside></div></main>
<div class="toast" role="status"></div><script src="i18n.js" defer></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="products.js" defer></script><script src="app.js" defer></script><script src="checkout.js" defer></script></body></html>
